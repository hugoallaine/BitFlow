[package]
name = "bitflow-server"
version = "0.1.0"
edition = "2024"

[[bin]]
name = "bitflow"
path = "src/main.rs"

[dependencies]
bitflow-shared = { path = "../shared", features = ["sqlx"] }
anyhow = "1"
argon2 = "0.5"
axum = "0.8"
futures-util = "0.3"
lofty = "0.25"
openidconnect = "4.1"
regex = "1"
reqwest = { version = "0.12", default-features = false, features = ["json", "rustls-tls"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha1 = "0.10"
sha2 = "0.10"
sqlx = { version = "0.8", default-features = false, features = ["runtime-tokio", "sqlite", "macros"] }
tokio = { version = "1", features = ["full"] }
tokio-util = { version = "0.7", features = ["io"] }
tower = { version = "0.5", features = ["util"] }
tower-http = { version = "0.6", features = ["fs", "compression-full", "set-header", "trace"] }
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
walkdir = "2"
