# Image Docker sur GitHub Container Registry (ghcr.io).
# main -> :latest, dev -> :dev, + :sha-xxxxxxx ; tag v1.2.3 -> :1.2.3 et :1.2 ; pull request -> build seul, sans publication.
name: docker

on:
  push:
    branches: [main, dev]
    tags: ["v*"]
  pull_request:
  workflow_dispatch:

concurrency:
  group: docker-${{ github.ref }}
  cancel-in-progress: true

jobs:
  image:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        if: github.event_name != 'pull_request'
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - id: meta
        uses: docker/metadata-action@v5
        with:
          images: ghcr.io/${{ github.repository }}
          tags: |
            type=raw,value=latest,enable={{is_default_branch}}
            type=ref,event=branch,enable=${{ github.ref_name != github.event.repository.default_branch }}
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
            type=sha
            type=ref,event=pr
      - uses: docker/build-push-action@v6
        with:
          context: .
          # shortcut: amd64 seul ; arm64 (Raspberry Pi…) sous QEMU multiplie le temps de compilation Rust, à ajouter avec un runner arm64 natif si besoin.
          platforms: linux/amd64
          push: ${{ github.event_name != 'pull_request' }}
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          # Cache des couches (dioxus-cli, dépendances apt) entre les builds.
          cache-from: type=gha
          cache-to: type=gha,mode=max
